# Render Blueprint for Echoes.
# Deploy: push this repo to GitHub, then "New + > Blueprint" on render.com and
# point it at the repo. Set the secret env vars (sync:false) in the dashboard.
#
# FREE tier: no persistent disk (disks require a paid plan). Storage under
# /app/data is ephemeral — generated stories/audio/photos reset on each restart
# or redeploy, and the instance sleeps after ~15 min idle (first request then
# cold-starts in ~30-50s). Live generation during a demo works fine.
# For durability + always-on, upgrade to `plan: starter` and add a disk block:
#   disk: { name: echoes-data, mountPath: /app/data, sizeGB: 1 }
services:
  - type: web
    name: echoes
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MURF_AI_API_KEY
        sync: false
      # Google Gemini powers all text + audio AI (story, dialogue, emotion,
      # Memory DNA, translation, transcription).
      - key: GEMINI_API_KEY
        sync: false
      # Optional model override (default in code: gemini-2.5-flash)
      # - key: GEMINI_MODEL
      #   value: gemini-2.0-flash
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: HOSTNAME
        value: 0.0.0.0
